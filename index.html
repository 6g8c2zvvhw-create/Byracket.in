/* Layout: announce bar, sticky header (wordmark, nav, search shortcut, cart), then one visible page at a time (home, shop, product, checkout, info) chosen by the URL hash. Cart is a side drawer. Dark look to match the black logo. */
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1d1d1d;
  --fg: #f4f4f4;
  --muted: #a3a3a3;
  --line: #2a2a2a;
  --lime: #a3e635;
  --lime-fg: #0a0a0a;
  --danger: #ff7b7b;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.in { max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; }
button, select, input, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.announce { background: var(--lime); color: var(--lime-fg); font-size: 0.82rem; font-weight: 600; }
.announce .in { padding-block: 8px; text-align: center; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .in { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 1.45rem; text-decoration: none; white-space: nowrap; }
.brand .r { color: var(--lime); }
nav { display: flex; align-items: center; gap: 20px; }
nav a { text-decoration: none; font-weight: 500; color: var(--muted); }
nav a:hover, nav a[aria-current="page"] { color: var(--fg); }
.cartbtn { background: var(--lime); color: var(--lime-fg); border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 700; white-space: nowrap; }
@media (max-width: 620px) { nav a { display: none; } }

.page { padding-block: 32px 56px; }
.crumbs { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
.crumbs a { color: var(--muted); }

/* Home */
.hero { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; align-items: center; padding-block: 8px 24px; }
@media (max-width: 800px) { .hero { grid-template-columns: 1fr; } .hero figure { order: -1; } }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lime); }
.hero h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; margin: 10px 0 14px; }
.hero p { color: var(--muted); max-width: 50ch; margin: 0 0 22px; font-size: 1.05rem; }
.hero figure { margin: 0; min-width: 0; }
.hero img { width: 100%; max-width: 100%; height: auto; display: block; }
.btn { display: inline-block; background: var(--lime); color: var(--lime-fg); font-weight: 700; text-decoration: none; padding: 12px 20px; border-radius: 8px; border: 0; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
.btn.ghost:hover { border-color: var(--lime); }
.sec { margin-top: 44px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.5rem; }
.sec-head a { color: var(--lime); font-weight: 600; text-decoration: none; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; text-align: left; color: var(--fg); min-width: 0; }
.cat:hover { border-color: var(--lime); }
.cat b { display: block; font-family: var(--font-display); font-size: 1.05rem; }
.cat span { color: var(--muted); font-size: 0.82rem; }
.brands { display: flex; flex-wrap: wrap; gap: 10px; }
.brandpill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-family: var(--font-display); font-weight: 700; color: var(--fg); }
.brandpill:hover { border-color: var(--lime); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
@media (max-width: 700px) { .steps { grid-template-columns: 1fr; } }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; gap: 12px; min-width: 0; }
.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: var(--lime-fg); font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; font-size: 0.9rem; }
.steps b { display: block; font-family: var(--font-display); }
.steps span { color: var(--muted); font-size: 0.9rem; }

/* Product grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
.card .pic { display: block; aspect-ratio: 1 / 1; background: #0d0d0d; border: 0; padding: 0; width: 100%; }
.card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.kicker { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card h3 { font-size: 1rem; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { color: var(--lime); }
.pricing { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.price { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.mrp { color: var(--muted); text-decoration: line-through; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.off { background: var(--lime); color: var(--lime-fg); font-size: 0.72rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
.tagnew { position: absolute; top: 10px; left: 10px; background: #000c; color: var(--lime); border: 1px solid var(--lime); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.heart { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #000b; color: var(--fg); font-size: 1.1rem; line-height: 1; }
.heart[aria-pressed="true"] { color: #ff5d7a; }
.card .act { display: flex; gap: 8px; margin-top: 10px; }
.card .act .btn { flex: 1; text-align: center; padding: 9px 10px; font-size: 0.88rem; }

/* Shop toolbar */
.bar { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 14px; }
@media (max-width: 600px) { .bar { grid-template-columns: 1fr; } }
.field, select { width: 100%; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--lime); color: var(--lime-fg); border-color: var(--lime); font-weight: 600; }
.range { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; color: var(--muted); font-size: 0.9rem; flex-wrap: wrap; }
.range input { accent-color: var(--lime); width: min(280px, 100%); }
.count { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
.none { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); }

/* Product page */
.pd { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
@media (max-width: 800px) { .pd { grid-template-columns: 1fr; gap: 20px; } }
.pd > * { min-width: 0; }
.pd .big { background: #0d0d0d; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 1 / 1; }
.pd .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pd h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 6px 0 12px; }
.pd .price { font-size: 1.8rem; }
.pd p { color: var(--muted); }
.lbl { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; display: block; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--lime); border-radius: 8px; overflow: hidden; }
.qty button { background: transparent; color: var(--lime); border: 0; width: 36px; height: 36px; font-size: 1.15rem; font-weight: 700; }
.qty span { min-width: 32px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.pd .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.specs { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 0.92rem; }
.specs th, .specs td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.specs th { color: var(--muted); font-weight: 500; width: 40%; padding-right: 12px; }

/* Drawer */
.veil { position: fixed; inset: 0; background: #000a; z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 41; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line); }

.x { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; font-size: 1.1rem; }

.drawer .df { padding: 16px; border-top: 1px solid var(--line); }

footer.bot a:hover { color: var(--lime); }
footer.bot div { min-width: 0; }

</style>

function saveCart() { store("br_cart", cart); store("br_wish", wish); }
function cartCount() { return cart.reduce(function (s, i) { return s + i.qty; }, 0); }
function subtotal() { return cart.reduce(function (s, i) { return s + byId(i.id).price * i.qty; }, 0); }
function delivery() { var s = subtotal(); return s === 0 ? 0 : (s >= SHOP.freeAbove ? 0 : SHOP.shippingFee); }
function addToCart(id, variant, qty) {
  var p = byId(id); variant = variant || p.variants[0]; qty = qty || 1;
  var found = cart.filter(function (i) { return i.id === id && i.variant === variant; })[0];
  if (found) found.qty = Math.min(20, found.qty + qty); else cart.push({ id: id, variant: variant, qty: qty });
  saveCart(); renderCartBits(); toast("Added to cart");
}
function changeQty(idx, d) { cart[idx].qty += d; if (cart[idx].qty <= 0) cart.splice(idx, 1); else cart[idx].qty = Math.min(20, cart[idx].qty); saveCart(); renderCartBits(); if (curPage() === "checkout") render(); }
function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2200); }
function toggleWish(id) { var i = wish.indexOf(id); if (i < 0) { wish.push(id); toast("Saved"); } else { wish.splice(i, 1); toast("Removed from saved"); } saveCart(); render(); }

    return true;

  return list;

function render() {

// ----- checkout logic -----
function validate() {
  var e = {};
  if (form.name.trim().length < 2) e.name = "Enter your name.";
  var ph = form.phone.replace(/[\s-]/g, "").replace(/^\+?91/, "");
  if (!/^[6-9]\d{9}$/.test(ph)) e.phone = "Enter a 10-digit mobile number.";
  if (!form.district) e.district = "Choose your district.";
  if (!/^6[789]\d{4}$/.test(form.pin.trim())) e.pin = "We deliver only in Kerala. PIN codes start with 67, 68 or 69.";
  if (form.addr.trim().length < 8) e.addr = "Enter your full address.";
  return e;
}
function orderText() {
  var lines = cart.map(function (i, n) { var p = byId(i.id); return (n + 1) + ". " + p.name + " (" + i.variant + ") x " + i.qty + " = " + inr(p.price * i.qty); });
  var s = subtotal(), d = delivery();
  return "New order for " + SHOP.name + "\nOrder ref: " + ORDER_REF + "\n\n" + lines.join("\n") + "\n\nSubtotal: " + inr(s) + "\nDelivery: " + (d ? inr(d) : "Free") + "\nTotal: " + inr(s + d) +
    "\nPayment: " + (state.pay === "COD" ? "Pay on delivery" : "UPI before dispatch") +
    "\n\nName: " + form.name.trim() + "\nPhone: " + form.phone.trim() + "\nAddress: " + form.addr.trim() + ", " + form.district + " - " + form.pin.trim() + (form.note.trim() ? "\nNote: " + form.note.trim() : "");
}
function updateCheckout(showErrors) {
  var wa = $("wa"); if (!wa) return;
  var e = validate(), ok = Object.keys(e).length === 0;
  ["name", "phone", "district", "pin", "addr"].forEach(function (k) {
    var box = $("f-" + k), bad = !!e[k] && (showErrors || box.dataset.touched === "1");
    box.className = "f" + (bad ? " bad" : ""); box.querySelector(".err").textContent = bad ? e[k] : "";
  });
  wa.setAttribute("aria-disabled", ok ? "false" : "true");
  wa.href = ok ? "https://wa.me/" + SHOP.whatsapp + "?text=" + encodeURIComponent(orderText()) : "#";
}

// ----- events -----
document.addEventListener("click", function (ev) {
  var t = ev.target, b;
  if ((b = t.closest("[data-add]"))) { addToCart(b.dataset.add); return; }
  if ((b = t.closest("[data-wish]"))) { toggleWish(b.dataset.wish); return; }
  if ((b = t.closest("[data-q]"))) { changeQty(+b.dataset.q, +b.dataset.d); return; }
  if ((b = t.closest("[data-gocat]"))) { state.cat = b.dataset.gocat; state.brand = "All"; location.hash = "shop"; if (curPage() === "shop") render(); return; }
  if ((b = t.closest("[data-gobrand]"))) { state.brand = b.dataset.gobrand; state.cat = "All"; location.hash = "shop"; if (curPage() === "shop") render(); return; }
  if ((b = t.closest("[data-cat]"))) { state.cat = b.dataset.cat; render(); return; }
  if ((b = t.closest("[data-brand]"))) { state.brand = b.dataset.brand; render(); return; }
  if ((b = t.closest("[data-var]"))) { state.variant[location.hash.slice(9)] = b.dataset.var; render(); return; }
  if (t.closest("#reset")) { state.cat = "All"; state.brand = "All"; state.q = ""; state.max = 25000; render(); return; }
  if (t.closest("#qminus")) { state.qty = Math.max(1, state.qty - 1); $("qval").textContent = state.qty; return; }
  if (t.closest("#qplus")) { state.qty = Math.min(20, state.qty + 1); $("qval").textContent = state.qty; return; }
  if (t.closest("#padd") || t.closest("#pnow")) {
    var id = location.hash.slice(9);
    addToCart(id, state.variant[id], state.qty); state.qty = 1;
    if (t.closest("#pnow")) location.hash = "checkout"; else { $("qval").textContent = 1; openCart(); }
    return;
  }
  if (t.closest("#opencart")) { openCart(); return; }
  if (t.closest("#closecart") || t.closest("#veil") || t.closest("#gocheckout") || t.closest("#goshop")) { closeCart(); return; }
  if (t.closest("#wa")) {
    if ($("wa").getAttribute("aria-disabled") === "true") { ev.preventDefault(); updateCheckout(true); return; }
    $("status").textContent = "WhatsApp is opening. Press send there to place the order."; return;
  }
  if (t.closest("#copy")) {
    var e = validate();
    if (Object.keys(e).length) { updateCheckout(true); $("status").textContent = "Fill in the highlighted details first."; return; }
    var txt = orderText(), done = function () { $("status").textContent = "Order text copied. Paste it in WhatsApp."; }, fail = function () { $("status").textContent = "Could not copy. Use the WhatsApp button instead."; };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (err) { fail(); }
  }
});
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "q") { state.q = t.value; var pos = t.selectionStart; render(); var n = $("q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} return; }
  if (t.id === "max") { state.max = +t.value; $("maxv").textContent = inr(state.max); $("res").innerHTML = resHtml(filtered()); return; }
  if (["name", "phone", "pin", "addr", "note"].indexOf(t.id) >= 0) {
    if (t.id === "pin") t.value = t.value.replace(/\D/g, "");
    form[t.id] = t.value; var box = $("f-" + t.id); if (box) box.dataset.touched = "1"; updateCheckout(false);
  }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.id === "sort") { state.sort = t.value; render(); }
  if (t.id === "district") { form.district = t.value; $("f-district").dataset.touched = "1"; updateCheckout(false); }
  if (t.name === "pay") { state.pay = t.value; updateCheckout(false); }
});
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeCart(); });

// ----- start -----
cart = (store("br_cart") || []).filter(function (i) { return i && byId(i.id); });
wish = (store("br_wish") || []).filter(byId);
$("promo").textContent = SHOP.promo;
$("shopnum").textContent = "+" + SHOP.whatsapp;
renderCartBits(); render();
</script>
